<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin-Panel | ITMA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="web192.png">
    
    <script>
    (function() {
        try {
            const user = JSON.parse(localStorage.getItem('teacher'));
            const adminLogins = ['admin'];
            if (!user || !adminLogins.includes(user.login)) {
                window.location.replace('index.html');
            }
        } catch (e) {
            window.location.replace('index.html');
        }
    })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container py-5">
   <div class="language-picker mb-4 d-flex justify-content-end align-items-center gap-3">
        <div class="glass-btn-group" id="langGroup">
            <div class="lang-slider"></div> 
            <button id="lang-ru" class="btn-lang active">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f3/Flag_of_Russia.svg" alt="RU"> Рус
            </button>
            <button id="lang-uz" class="btn-lang">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Flag_of_Uzbekistan.svg" alt="UZ"> Uzb
            </button>
        </div>
        <!-- ДОБАВЛЕНА КНОПКА ВЫХОДА -->
        <button id="logoutBtn" class="btn btn-outline-danger d-flex align-items-center gap-2" style="border-radius: 12px; padding: 6px 16px; font-weight: 600;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
            </svg>
            <span data-i18n="logout">Выйти</span>
        </button>
    </div>

    <h2 data-i18n="admin_panel_title" class="main-title text-center">Админ-панель ITMA</h2>

    <div class="control-panel mb-5 mt-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="dateFilter" class="form-label text-white fw-medium" data-i18n="choose_date">Выберите дату:</label>
                <select id="dateFilter" class="form-select custom-select"></select>
            </div>
            <div class="col-md-8 d-flex justify-content-md-end gap-2 flex-wrap">
                <button type="button" class="btn btn-action btn-primary-custom" data-bs-toggle="modal" data-bs-target="#excelModal">
                    <span class="me-1">📄</span> <span data-i18n="export_excel">Excel отчёт</span>
                </button>
                <button id="clearHistory" class="btn btn-action btn-danger-custom" data-i18n="clear_history">Очистить историю</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card stat-card main-stat h-100">
                <div class="card-body">
                    <h5 class="card-subtitle" data-i18n="total_absent">Всего отсутствующих</h5>
                    <p class="stat-number" id="totalAbsent">0</p>
                    <div class="stat-decorator"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h5 class="card-title fw-bold mb-4" data-i18n="reason_stats">Статистика причин</h5>
                    <div class="chart-wrapper">
                        <div class="canvas-container">
                            <canvas id="reasonChart"></canvas>
                        </div>
                        <div id="reasonLegend" class="custom-legend"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="classChartsContainer" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mt-2"></div>
</div>

<div class="modal fade" id="excelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg" style="background: #1a1a1a; border: 1px solid #333; border-radius: 20px;">
      <div class="modal-header border-bottom border-secondary">
        <h5 class="modal-title text-white fw-bold" data-i18n="select_period">Выберите период отчета</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="d-grid gap-3">
          <button class="btn btn-outline-primary py-3 fw-bold rounded-pill" onclick="handleExcelExport('day')">
            📅 <span data-i18n="report_day">За 1 день</span>
          </button>
          <button class="btn btn-outline-info py-3 fw-bold rounded-pill" onclick="handleExcelExport('week')">
            🗓️ <span data-i18n="report_week">За неделю (6 дн.)</span>
          </button>
          <button class="btn btn-outline-warning py-3 fw-bold rounded-pill" onclick="handleExcelExport('month')">
            📊 <span data-i18n="report_month">За месяц</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="admin.js"></script>
</body>
</html>
